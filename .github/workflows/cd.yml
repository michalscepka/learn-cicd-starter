name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build
        run: ./scripts/buildprod.sh

      - name: Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Use gcloud CLI
        run: 'gcloud info'

      - name: Build docker image
        run: docker build -t notely:latest .
      
      - name: Push image to gcloud
        run: gcloud builds submit --tag europe-central2-docker.pkg.dev/notely-482219/notely-ar-repo/notely:latest .
        